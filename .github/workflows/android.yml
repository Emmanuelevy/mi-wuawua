name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/Android
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Unpack the web bundle into the Android project
        run: |
          rm -rf android-app/android/app/src/main/assets/public
          mkdir -p android-app/android/app/src/main/assets/public
          unzip -q android-app/android/web-bundle.zip -d android-app/android/app/src/main/assets/public

      - name: Generate app icons
        run: |
          pip install -q Pillow
          python3 android-app/android/generate-icons.py

      - name: Install Node dependencies
        run: |
          cd android-app
          npm install

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O gradle.zip
          unzip -q gradle.zip -d $HOME/gradle

      - name: Build debug APK
        run: |
          cd android-app/android
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          $HOME/gradle/gradle-8.11.1/bin/gradle assembleDebug --no-daemon

      - name: Build release AAB
        run: |
          cd android-app/android
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "${{ secrets.ANDROID_KEYSTORE_B64_A }}${{ secrets.ANDROID_KEYSTORE_B64_B }}" | base64 -d > $HOME/release.jks
          ls -l $HOME/release.jks
          sha256sum $HOME/release.jks
          $HOME/gradle/gradle-8.11.1/bin/gradle bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$HOME/release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-wuawua-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mi-wuawua-release-aab
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab
